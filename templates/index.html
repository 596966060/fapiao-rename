<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发票批量重命名工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f3ff;
        }

        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
        }

        .upload-formats {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .results-section {
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .progress-section {
            margin-bottom: 20px;
        }

        .progress-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-bar-container {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 0 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            width: 0%;
        }

        .file-list {
            max-height: 600px;
            overflow-y: auto;
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .file-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .file-item.error {
            border-left-color: #f56565;
        }

        .file-item.success {
            border-left-color: #48bb78;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .file-new-name {
            color: #667eea;
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .file-fields {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 12px;
        }

        .field {
            color: #666;
        }

        .field-label {
            font-weight: 600;
            color: #333;
        }

        .file-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 8px;
        }

        .file-status.success {
            background: #c6f6d5;
            color: #22543d;
        }

        .file-status.error {
            background: #fed7d7;
            color: #742a2a;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            min-width: 150px;
            background: #f0f3ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-upload {
            background: #667eea;
            color: white;
        }

        .btn-upload:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-download {
            background: #48bb78;
            color: white;
        }

        .btn-download:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(72, 187, 120, 0.3);
        }

        .btn-download:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .btn-export {
            background: #ed8936;
            color: white;
        }

        .btn-export:hover {
            background: #dd6b20;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(237, 137, 54, 0.3);
        }

        .btn-export:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: #f56565;
            color: white;
        }

        .btn-reset:hover {
            background: #e53e3e;
        }

        .status-message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-message.loading {
            background: #e0e7ff;
            color: #667eea;
        }

        .status-message.success {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-message.error {
            background: #fed7d7;
            color: #742a2a;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        /* ---- 批次面板 ---- */
        .batch-panel {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
            color: white;
            display: none;
        }
        .batch-panel.show { display: block; }
        .batch-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .batch-panel-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .batch-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .batch-stat {
            text-align: center;
            background: rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 10px 20px;
            min-width: 80px;
        }
        .batch-stat-num {
            font-size: 26px;
            font-weight: 700;
        }
        .batch-stat-label {
            font-size: 11px;
            opacity: 0.75;
            margin-top: 2px;
        }
        .batch-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-batch-add {
            background: #805ad5;
            color: white;
        }
        .btn-batch-add:hover {
            background: #6b46c1;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(128,90,213,0.4);
        }
        .btn-batch-add:disabled {
            background: #cbd5e0;
            color: #718096;
            cursor: not-allowed;
            transform: none;
        }
        .btn-batch-dl {
            background: #38a169;
            color: white;
        }
        .btn-batch-dl:hover { background: #2f855a; transform: translateY(-2px); }
        .btn-batch-dl:disabled { background: rgba(255,255,255,0.2); cursor: not-allowed; transform: none; }
        .btn-batch-exp {
            background: #dd6b20;
            color: white;
        }
        .btn-batch-exp:hover { background: #c05621; transform: translateY(-2px); }
        .btn-batch-exp:disabled { background: rgba(255,255,255,0.2); cursor: not-allowed; transform: none; }
        .btn-batch-clear {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .btn-batch-clear:hover { background: rgba(245,101,101,0.7); }
        .btn-batch-clear:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ---- 编辑功能 ---- */
        .btn-edit {
            background: none;
            border: 1px solid #667eea;
            color: #667eea;
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-edit:hover { background: #667eea; color: white; }
        .edit-form { display: none; margin-top: 12px; }
        .edit-form.active { display: block; }
        .edit-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }
        .edit-field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #555;
            margin-bottom: 3px;
        }
        .edit-field input {
            display: block;
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 13px;
            color: #333;
            transition: border-color 0.2s;
        }
        .edit-field input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102,126,234,0.15);
        }
        .edit-btns { display: flex; gap: 8px; }
        .btn-save {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-save:hover { background: #764ba2; }
        .btn-cancel {
            background: none;
            color: #999;
            border: 1px solid #e2e8f0;
            padding: 6px 14px;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-cancel:hover { color: #e53e3e; border-color: #e53e3e; }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .file-fields {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📄 发票批量重命名工具</h1>
            <p class="subtitle">智能识别 → 自动重命名 → 批量下载</p>

            <div id="initStatus" class="status-message show loading">
                <span class="spinner"></span>正在初始化 OCR 模型（首次需要 1-2 分钟），请稍候...
            </div>

            <div id="statusMessage" class="status-message"></div>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-text">点击或拖拽上传</div>
                <div class="upload-hint">支持批量上传单个文件或 ZIP 压缩包</div>
                <div class="upload-formats">
                    ✓ PDF &nbsp; ✓ JPG/PNG/BMP/GIF/TIFF &nbsp; ✓ ZIP
                </div>
                <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.bmp,.gif,.tiff,.tif,.zip">
            </div>

            <div id="resultsSection" class="results-section">
                <div class="stats" id="stats" style="display: none;">
                    <div class="stat-box">
                        <div class="stat-number" id="totalFiles">0</div>
                        <div class="stat-label">本次文件数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="successFiles">0</div>
                        <div class="stat-label">成功识别</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="failFiles">0</div>
                        <div class="stat-label">识别失败</div>
                    </div>
                </div>

                <div class="file-list" id="fileList"></div>

                <div class="button-group" style="margin-bottom: 16px;">
                    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
                        📤 继续上传
                    </button>
                    <button class="btn-download" id="downloadBtn" onclick="downloadResults()">
                        ⬇️ 本次下载
                    </button>
                    <button class="btn-export" id="exportBtn" onclick="exportCSV()" disabled>
                        📊 本次表格
                    </button>
                    <button class="btn-batch-add" id="addBatchBtn" onclick="addToBatch()" disabled>
                        ➕ 加入批次
                    </button>
                    <button class="btn-reset" onclick="resetAll()">
                        🔄 重新开始
                    </button>
                </div>

                <!-- 批次累积面板 -->
                <div class="batch-panel" id="batchPanel">
                    <div class="batch-panel-header">
                        <span class="batch-panel-title">📦 当前批次（跨多次上传的累积结果）</span>
                    </div>
                    <div class="batch-stats">
                        <div class="batch-stat">
                            <div class="batch-stat-num" id="batchTotal">0</div>
                            <div class="batch-stat-label">累积张数</div>
                        </div>
                        <div class="batch-stat">
                            <div class="batch-stat-num" id="batchSuccess">0</div>
                            <div class="batch-stat-label">成功识别</div>
                        </div>
                    </div>
                    <div class="batch-actions">
                        <button class="btn-batch-dl" id="batchDlBtn" onclick="downloadBatch()">
                            ⬇️ 下载批次 ZIP
                        </button>
                        <button class="btn-batch-exp" id="batchExpBtn" onclick="exportBatchCSV()">
                            📊 导出批次表格
                        </button>
                        <button class="btn-batch-clear" id="batchClearBtn" onclick="clearBatch()">
                            🗑️ 清空批次
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = null;
        let uploadedResults = [];
        let ocrReady = false;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const resultsSection = document.getElementById('resultsSection');

        // ---- OCR 状态检查 ----
        function checkOCRStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    ocrReady = data.ready;
                    const initStatus = document.getElementById('initStatus');
                    if (data.ready) {
                        initStatus.innerHTML = '✅ OCR 已准备好，可以开始上传';
                        initStatus.className = 'status-message show success';
                        setTimeout(() => { initStatus.style.display = 'none'; }, 3000);
                    } else {
                        setTimeout(checkOCRStatus, 2000);
                    }
                })
                .catch(() => { setTimeout(checkOCRStatus, 2000); });
        }
        checkOCRStatus();
        updateBatchStatus();   // 页面刷新时也恢复批次计数

        // ---- 拖拽 ----
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (ocrReady) uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('dragover'); });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (ocrReady) handleFiles(e.dataTransfer.files);
        });
        uploadArea.addEventListener('click', () => { if (ocrReady) fileInput.click(); });
        fileInput.addEventListener('change', (e) => { if (ocrReady) handleFiles(e.target.files); });

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.innerHTML = type === 'loading' ? `<span class="spinner"></span>${message}` : message;
            el.className = `status-message show ${type}`;
        }

        // ---- 上传处理 ----
        function handleFiles(files) {
            if (files.length === 0) return;
            const formData = new FormData();
            for (let file of files) formData.append('files[]', file);

            showStatus('⏳ 处理中，请稍候...', 'loading');
            uploadArea.style.opacity = '0.5';

            fetch('/api/upload', { method: 'POST', body: formData })
            .then(r => {
                const ct = r.headers.get('content-type') || '';
                if (!ct.includes('application/json')) {
                    return r.text().then(t => { throw new Error(`服务器错误 (${r.status})：${t.slice(0, 120) || '无响应内容'}`); });
                }
                return r.json().then(data => ({ data, status: r.status }));
            })
            .then(({ data }) => {
                if (data.error) {
                    showStatus(`❌ ${data.error}`, 'error');
                } else if (!data.session_id || !data.results) {
                    showStatus(`❌ 服务器返回数据异常`, 'error');
                } else {
                    currentSessionId = data.session_id;
                    uploadedResults = data.results;
                    displayResults(data);
                    showStatus('✅ 识别完成！', 'success');
                }
            })
            .catch(err => { showStatus(`❌ 上传失败: ${err.message}`, 'error'); })
            .finally(() => { uploadArea.style.opacity = '1'; });
        }

        // ---- 结果展示 ----
        function displayResults(data) {
            const totalFiles   = data.total;
            const successFiles = data.results.filter(r => r.status === 'success').length;
            const failFiles    = totalFiles - successFiles;

            document.getElementById('totalFiles').textContent   = totalFiles;
            document.getElementById('successFiles').textContent = successFiles;
            document.getElementById('failFiles').textContent    = failFiles;
            document.getElementById('stats').style.display      = 'flex';

            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            console.log('=== OCR DEBUG INFO ===');
            console.log('Raw Results:', JSON.stringify(data.results, null, 2));

            data.results.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `file-item ${item.status}`;

                if (item.status === 'success') {
                    const d = item.data || {};
                    if (d._raw_text) {
                        console.log(`\n--- File ${idx + 1}: ${item.filename} ---`);
                        console.log('Raw OCR Text:\n' + d._raw_text);
                    }
                    const rawHtml = d._raw_text
                        ? `<details style="margin-top:10px;"><summary style="cursor:pointer;color:#667eea;">📋 查看原始 OCR 文本</summary>
                           <div style="margin-top:8px;padding:10px;background:#f5f5f5;border-radius:4px;font-size:11px;color:#666;max-height:150px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;">${d._raw_text}</div></details>` : '';

                    const esc = s => String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    div.innerHTML = `
                        <div class="file-name">📄 ${item.filename || 'Unknown'}</div>
                        <div class="file-new-name" id="newname-${idx}">✓ ${item.new_name || 'No name'}</div>
                        <div class="file-fields" id="fields-${idx}">
                            <div class="field"><span class="field-label">日期:</span> <span id="v-date-${idx}">${d.date || '-'}</span></div>
                            <div class="field"><span class="field-label">号码:</span> <span id="v-num-${idx}">${d.invoice_number || '-'}</span></div>
                            <div class="field"><span class="field-label">购买方:</span> <span id="v-buyer-${idx}">${d.buyer || '-'}</span></div>
                            <div class="field"><span class="field-label">销售方:</span> <span id="v-supplier-${idx}">${d.supplier || '-'}</span></div>
                            <div class="field"><span class="field-label">金额（不含税）:</span> <span id="v-taxfree-${idx}">${d.tax_free_amount ? d.tax_free_amount + ' 元' : '-'}</span></div>
                            <div class="field"><span class="field-label">税额:</span> <span id="v-tax-${idx}">${d.tax_amount ? d.tax_amount + ' 元' : '-'}</span></div>
                            <div class="field"><span class="field-label">价税合计:</span> <span id="v-amount-${idx}">${d.amount ? d.amount + ' 元' : '-'}</span></div>
                        </div>
                        <span class="file-status success">✓ 识别成功</span>
                        <button class="btn-edit" onclick="toggleEdit(${idx})">✏️ 编辑字段</button>

                        <div class="edit-form" id="edit-form-${idx}">
                            <div class="edit-grid">
                                <div class="edit-field"><label>日期</label><input id="e-date-${idx}" value="${esc(d.date)}" placeholder="YYYY-MM-DD"></div>
                                <div class="edit-field"><label>发票号码</label><input id="e-num-${idx}" value="${esc(d.invoice_number)}" placeholder="发票号码"></div>
                                <div class="edit-field"><label>购买方</label><input id="e-buyer-${idx}" value="${esc(d.buyer)}" placeholder="购买方名称"></div>
                                <div class="edit-field"><label>销售方</label><input id="e-supplier-${idx}" value="${esc(d.supplier)}" placeholder="销售方名称"></div>
                                <div class="edit-field"><label>金额（不含税）</label><input id="e-taxfree-${idx}" value="${esc(d.tax_free_amount)}" placeholder="0.00"></div>
                                <div class="edit-field"><label>税额</label><input id="e-tax-${idx}" value="${esc(d.tax_amount)}" placeholder="0.00"></div>
                                <div class="edit-field"><label>价税合计</label><input id="e-amount-${idx}" value="${esc(d.amount)}" placeholder="0.00"></div>
                            </div>
                            <div class="edit-btns">
                                <button class="btn-save" onclick="saveEdit(${idx})">💾 保存</button>
                                <button class="btn-cancel" onclick="cancelEdit(${idx})">✕ 取消</button>
                            </div>
                        </div>
                        ${rawHtml}`;
                } else {
                    div.innerHTML = `
                        <div class="file-name">❌ ${item.filename || 'Unknown'}</div>
                        <span class="file-status error">✗ ${item.error || 'Unknown error'}</span>`;
                }
                fileList.appendChild(div);
            });

            resultsSection.classList.add('show');
            document.getElementById('downloadBtn').disabled = successFiles === 0;
            document.getElementById('exportBtn').disabled   = totalFiles === 0;
            document.getElementById('addBatchBtn').disabled = totalFiles === 0;
        }

        // ---- 本次下载 / 表格 ----
        function downloadResults() {
            if (!currentSessionId) return;
            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            showStatus('⏳ 准备下载...', 'loading');
            window.location.href = `/api/download/${currentSessionId}`;
            setTimeout(() => { btn.disabled = false; showStatus('✅ 下载完成！', 'success'); }, 1000);
        }

        function exportCSV() {
            if (!currentSessionId) return;
            const btn = document.getElementById('exportBtn');
            btn.disabled = true;
            showStatus('⏳ 正在生成表格...', 'loading');
            window.location.href = `/api/export/${currentSessionId}`;
            setTimeout(() => { btn.disabled = false; showStatus('✅ 表格已导出！', 'success'); }, 1000);
        }

        // ---- 批次管理 ----
        function updateBatchStatus() {
            fetch('/api/batch/status')
            .then(r => r.json())
            .then(d => {
                document.getElementById('batchTotal').textContent   = d.total;
                document.getElementById('batchSuccess').textContent = d.success;
                const panel = document.getElementById('batchPanel');
                if (d.total > 0) {
                    panel.classList.add('show');
                    resultsSection.classList.add('show');
                } else {
                    panel.classList.remove('show');
                }
            })
            .catch(() => {});
        }

        function addToBatch() {
            if (!currentSessionId) return;
            const btn = document.getElementById('addBatchBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 加入中...';
            fetch(`/api/batch/add/${currentSessionId}`, { method: 'POST' })
            .then(r => r.json())
            .then(d => {
                if (d.error) { showStatus(`❌ ${d.error}`, 'error'); return; }
                document.getElementById('batchTotal').textContent   = d.total;
                document.getElementById('batchSuccess').textContent = d.success;
                document.getElementById('batchPanel').classList.add('show');
                showStatus(`✅ 已加入批次！批次累计 ${d.total} 张`, 'success');
                btn.textContent = '✅ 已加入';
            })
            .catch(() => { showStatus('❌ 加入批次失败', 'error'); btn.textContent = '➕ 加入批次'; btn.disabled = false; });
        }

        function downloadBatch() {
            showStatus('⏳ 正在打包批次文件...', 'loading');
            window.location.href = '/api/batch/download';
            setTimeout(() => showStatus('✅ 批次下载完成！', 'success'), 1500);
        }

        function exportBatchCSV() {
            showStatus('⏳ 正在生成批次表格...', 'loading');
            window.location.href = '/api/batch/export';
            setTimeout(() => showStatus('✅ 批次表格已导出！', 'success'), 1000);
        }

        function clearBatch() {
            if (!confirm('确认清空当前批次？已累积的文件列表将被清除（已下载的文件不受影响）')) return;
            fetch('/api/batch/clear', { method: 'POST' })
            .then(r => r.json())
            .then(() => {
                document.getElementById('batchTotal').textContent   = 0;
                document.getElementById('batchSuccess').textContent = 0;
                document.getElementById('batchPanel').classList.remove('show');
                showStatus('🗑️ 批次已清空', 'success');
            })
            .catch(() => showStatus('❌ 清空失败', 'error'));
        }

        // ---- 编辑字段 ----
        function toggleEdit(idx) {
            const form = document.getElementById(`edit-form-${idx}`);
            form.classList.toggle('active');
        }

        function cancelEdit(idx) {
            document.getElementById(`edit-form-${idx}`).classList.remove('active');
        }

        function saveEdit(idx) {
            if (!currentSessionId) return;
            const payload = {
                date:           document.getElementById(`e-date-${idx}`).value,
                invoice_number: document.getElementById(`e-num-${idx}`).value,
                buyer:          document.getElementById(`e-buyer-${idx}`).value,
                supplier:       document.getElementById(`e-supplier-${idx}`).value,
                tax_free_amount:document.getElementById(`e-taxfree-${idx}`).value,
                tax_amount:     document.getElementById(`e-tax-${idx}`).value,
                amount:         document.getElementById(`e-amount-${idx}`).value,
            };
            const btn = document.querySelector(`#edit-form-${idx} .btn-save`);
            btn.disabled = true;
            btn.textContent = '⏳ 保存中...';

            fetch(`/api/update/${currentSessionId}/${idx}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                if (res.error) { showStatus(`❌ ${res.error}`, 'error'); return; }
                const d = res.data;
                // 更新显示值
                document.getElementById(`newname-${idx}`).textContent = '✓ ' + res.new_name;
                document.getElementById(`v-date-${idx}`).textContent     = d.date || '-';
                document.getElementById(`v-num-${idx}`).textContent      = d.invoice_number || '-';
                document.getElementById(`v-buyer-${idx}`).textContent    = d.buyer || '-';
                document.getElementById(`v-supplier-${idx}`).textContent = d.supplier || '-';
                document.getElementById(`v-taxfree-${idx}`).textContent  = d.tax_free_amount ? d.tax_free_amount + ' 元' : '-';
                document.getElementById(`v-tax-${idx}`).textContent      = d.tax_amount ? d.tax_amount + ' 元' : '-';
                document.getElementById(`v-amount-${idx}`).textContent   = d.amount ? d.amount + ' 元' : '-';
                document.getElementById(`edit-form-${idx}`).classList.remove('active');
                showStatus('✅ 已保存，文件名已同步更新', 'success');
            })
            .catch(() => showStatus('❌ 保存失败', 'error'))
            .finally(() => { btn.disabled = false; btn.textContent = '💾 保存'; });
        }

        // ---- 重新开始（只清本次，不清批次）----
        function resetAll() {
            fileInput.value = '';
            document.getElementById('fileList').innerHTML = '';
            document.getElementById('statusMessage').classList.remove('show');
            document.getElementById('stats').style.display = 'none';
            currentSessionId = null;
            uploadedResults  = [];
            document.getElementById('exportBtn').disabled   = true;
            document.getElementById('downloadBtn').disabled = true;
            document.getElementById('addBatchBtn').disabled = true;
            document.getElementById('addBatchBtn').textContent = '➕ 加入批次';
            // 如果批次也为空就隐藏整个结果区
            fetch('/api/batch/status').then(r => r.json()).then(d => {
                if (d.total === 0) resultsSection.classList.remove('show');
            }).catch(() => { resultsSection.classList.remove('show'); });
            uploadArea.click();
        }
    </script>
</body>
</html>
